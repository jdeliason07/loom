<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vates — No. 01</title>
<meta name="description" content="No. 01 — a one-piece borosilicate glass bottle with a machined steel cap. Simply essential. $99.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#14171A">

<link rel="icon" href="assets/brand/vates-mark.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/brand/loom-colors.css">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<!-- ── The reel: hero first, then the ground the whole site sits on ──
     The intro film plays once on load; when it ends app.js hands over to
     the reel of stills, which crossfades from one picture to the next and
     loops for the rest of the visit. No loop attribute on the video on
     purpose — without "ended" there is no handover. app.js drives --bg-p
     from 0 (hero) to 1 (paused background).

     The reel names its pictures here rather than in app.js: data-frame-src
     is the path with {n} standing in for a two-digit number, counted from
     01 up to data-frame-count. The two slots take turns, so the next picture
     is decoded into the idle one before it is faded up; each holds the
     picture whole over a blurred copy of itself. -->
<div class="backdrop" id="backdrop" aria-hidden="true">
  <video class="backdrop__video" id="backdrop-video" autoplay muted playsinline
         preload="metadata" tabindex="-1"
         poster="assets/img/hero-poster.jpg">
    <source src="assets/video/intro.mp4"  type="video/mp4">
    <source src="assets/video/intro.webm" type="video/webm">
  </video>
  <div class="reel" id="reel"
       data-frame-src="assets/img/reel/{n}.webp"
       data-frame-count="30">
    <div class="reel__frame">
      <img class="reel__blur" alt="" decoding="async">
      <img class="reel__pic" alt="" decoding="async">
    </div>
    <div class="reel__frame">
      <img class="reel__blur" alt="" decoding="async">
      <img class="reel__pic" alt="" decoding="async">
    </div>
  </div>
  <div class="backdrop__scrim"></div>
  <div class="backdrop__wash"></div>
</div>

<main id="main">

  <!-- ── Hero: the reel holds the screen, and nothing over it ──── -->
  <section class="hero" id="top">
    <a class="hero__cue" href="#vates" aria-label="Scroll on">
      <span class="hero__cue-line" aria-hidden="true"></span>
    </a>
  </section>

  <!-- ── The wordmark, at full scale ─────────────────────────── -->
  <section class="statement" id="vates">
    <h1 class="wordmark wordmark--hero reveal">
      <img src="assets/brand/vates-wordmark.svg" alt="vates" width="893" height="184">
    </h1>
    <p class="statement__tagline reveal">For the creators of the world.</p>
  </section>

  <!-- ── The bottle ──────────────────────────────────────────── -->
  <section class="section section--product" id="product">
    <div class="container">
      <p class="label">The bottle</p>

      <div class="product__grid">
        <div class="product__media">
          <div class="product__stage">
            <picture>
              <source srcset="assets/img/no-01.webp" type="image/webp">
              <img src="assets/img/no-01.jpg" width="1179" height="1124"
                   alt="Two No. 01 bottles — one clear, filled with lemon water, one smoke grey — on a workbench, in front of a designer at work over drawings and a keyboard.">
            </picture>
          </div>
        </div>

        <div class="product__detail">
          <h2 class="product__title">No. 01</h2>
          <p class="product__lead">Simply essential.</p>
          <p class="product__price">$99</p>

          <form class="purchase" id="purchase-form">
            <div class="stepper" role="group" aria-label="Quantity">
              <button type="button" class="stepper__btn" data-step="-1" aria-label="Decrease quantity">−</button>
              <input class="stepper__input" id="qty" name="qty" type="number"
                     value="1" min="1" max="10" step="1" inputmode="numeric" aria-label="Quantity">
              <button type="button" class="stepper__btn" data-step="1" aria-label="Increase quantity">+</button>
            </div>
            <button type="submit" class="btn btn--primary">Purchase</button>
          </form>
        </div>
      </div>
    </div>
  </section>

</main>

<!-- ── Footer ────────────────────────────────────────────────── -->
<footer class="site-footer">
  <div class="container site-footer__inner">
    <p class="wordmark wordmark--footer">
      <img src="assets/brand/vates-wordmark.svg" alt="vates" width="893" height="184">
    </p>
    <p class="site-footer__tagline">For the creators of the world.</p>
    <p class="site-footer__meta">© <span id="year">2026</span> vates — No. 01, open release, numbered by hand.</p>
  </div>
</footer>

<!-- ── Order drawer ──────────────────────────────────────────── -->
<div class="drawer-backdrop" id="drawer-backdrop" hidden></div>

<aside class="drawer" id="order-drawer" role="dialog" aria-modal="true"
       aria-labelledby="drawer-title" hidden>
  <div class="drawer__head">
    <h2 class="drawer__title" id="drawer-title">Your order</h2>
    <button type="button" class="drawer__close" id="drawer-close" aria-label="Close order drawer">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none"
           stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>
  </div>

  <div class="drawer__body" id="drawer-body">
    <p class="drawer__empty" id="drawer-empty">Nothing here yet.</p>
    <ul class="line-items" id="line-items"></ul>
  </div>

  <div class="drawer__foot">
    <div class="drawer__total">
      <span class="label">Total</span>
      <span class="drawer__total-value" id="drawer-total" aria-live="polite">$0</span>
    </div>
    <button type="button" class="btn btn--primary btn--block" id="checkout" disabled>Checkout</button>
    <p class="drawer__notice" id="drawer-notice" role="status" hidden></p>
    <p class="drawer__fineprint">Demonstration storefront. No payment is processed.</p>
  </div>
</aside>

<script src="assets/js/app.js"></script>
</body>
</html>
