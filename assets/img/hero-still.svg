<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"
     preserveAspectRatio="xMidYMid slice" role="img" aria-label="">
  <!-- Static hero backdrop. Replace with real footage by supplying a poster
       image + MP4/WebM to the <video> in index.html; see README. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="46%" r="62%">
      <stop offset="0%"   stop-color="#2E3237" stop-opacity="0.95"/>
      <stop offset="55%"  stop-color="#1B1F23" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#14171A" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="streak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#B8BFC8" stop-opacity="0"/>
      <stop offset="35%"  stop-color="#B8BFC8" stop-opacity="0.10"/>
      <stop offset="65%"  stop-color="#B8BFC8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#B8BFC8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#14171A" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0E1114" stop-opacity="1"/>
    </linearGradient>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <filter id="soften" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#14171A"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Soft hard-key wash, low and off-centre, like a single studio source -->
  <g filter="url(#soften)" opacity="0.5">
    <ellipse cx="520" cy="360" rx="300" ry="230" fill="#2E3237"/>
    <ellipse cx="1120" cy="520" rx="260" ry="200" fill="#1F2429"/>
  </g>

  <!-- Vertical light bands: glass edges caught by the key -->
  <g opacity="0.55">
    <rect x="286"  y="0" width="2"  height="900" fill="url(#streak)"/>
    <rect x="612"  y="0" width="1"  height="900" fill="url(#streak)"/>
    <rect x="978"  y="0" width="3"  height="900" fill="url(#streak)"/>
    <rect x="1284" y="0" width="1"  height="900" fill="url(#streak)"/>
  </g>

  <rect y="600" width="1600" height="300" fill="url(#floor)"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.05"/>
</svg>
