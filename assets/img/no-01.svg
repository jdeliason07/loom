<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1120" width="480" height="1120"
     role="img" aria-label="No. 01 — a one-piece borosilicate glass bottle with a machined steel cap.">
  <!-- Placeholder rendering of No. 01. Swap for the studio photograph
       (bottle on transparent background) when it exists; see README. -->
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#B8BFC8" stop-opacity="0.16"/>
      <stop offset="18%"  stop-color="#E4E7EA" stop-opacity="0.10"/>
      <stop offset="46%"  stop-color="#7C8590" stop-opacity="0.05"/>
      <stop offset="78%"  stop-color="#B8BFC8" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#454C54" stop-opacity="0.14"/>
    </linearGradient>

    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#454C54"/>
      <stop offset="14%"  stop-color="#8C949E"/>
      <stop offset="32%"  stop-color="#E4E7EA"/>
      <stop offset="52%"  stop-color="#7C8590"/>
      <stop offset="74%"  stop-color="#B8BFC8"/>
      <stop offset="100%" stop-color="#3A4046"/>
    </linearGradient>

    <linearGradient id="keylight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FAFAFA" stop-opacity="0"/>
      <stop offset="12%"  stop-color="#FAFAFA" stop-opacity="0.55"/>
      <stop offset="80%"  stop-color="#FAFAFA" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FAFAFA" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="rimlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#B8BFC8" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#B8BFC8" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#B8BFC8" stop-opacity="0.06"/>
    </linearGradient>

    <radialGradient id="contact" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <path id="vessel"
      d="M 176,152
         L 176,262
         C 176,306 111,326 111,398
         L 111,996
         C 111,1030 135,1052 169,1052
         L 311,1052
         C 345,1052 369,1030 369,996
         L 369,398
         C 369,326 304,306 304,262
         L 304,152 Z"/>

    <clipPath id="vesselClip"><use href="#vessel"/></clipPath>
  </defs>

  <!-- contact shadow -->
  <ellipse cx="240" cy="1064" rx="168" ry="26" fill="url(#contact)"/>

  <!-- body -->
  <use href="#vessel" fill="url(#glass)"/>

  <g clip-path="url(#vesselClip)">
    <!-- single hard key, left of centre -->
    <rect x="140" y="300" width="17" height="700" rx="8" fill="url(#keylight)"/>
    <rect x="166" y="330" width="5"  height="620" rx="2" fill="url(#keylight)" opacity="0.5"/>
    <!-- rim return on the right edge -->
    <rect x="342" y="286" width="12" height="740" rx="6" fill="url(#rimlight)"/>
    <!-- thickness of the base -->
    <rect x="111" y="1004" width="258" height="16" fill="#B8BFC8" opacity="0.16"/>
    <rect x="111" y="988"  width="258" height="4"  fill="#E4E7EA" opacity="0.10"/>
  </g>

  <use href="#vessel" fill="none" stroke="#B8BFC8" stroke-opacity="0.38" stroke-width="2"/>

  <!-- neck ring / shoulder seam -->
  <path d="M 176,262 C 176,306 111,326 111,398" fill="none" stroke="#E4E7EA" stroke-opacity="0.18" stroke-width="2"/>
  <line x1="176" y1="158" x2="304" y2="158" stroke="#B8BFC8" stroke-opacity="0.22" stroke-width="2"/>

  <!-- machined steel cap -->
  <g>
    <rect x="166" y="44" width="148" height="112" rx="10" fill="url(#steel)"/>
    <rect x="166" y="44" width="148" height="112" rx="10" fill="none" stroke="#14171A" stroke-opacity="0.55" stroke-width="1.5"/>
    <g stroke="#14171A" stroke-opacity="0.30" stroke-width="1.5">
      <line x1="186" y1="60" x2="186" y2="140"/><line x1="200" y1="60" x2="200" y2="140"/>
      <line x1="214" y1="60" x2="214" y2="140"/><line x1="228" y1="60" x2="228" y2="140"/>
      <line x1="242" y1="60" x2="242" y2="140"/><line x1="256" y1="60" x2="256" y2="140"/>
      <line x1="270" y1="60" x2="270" y2="140"/><line x1="284" y1="60" x2="284" y2="140"/>
      <line x1="298" y1="60" x2="298" y2="140"/>
    </g>
    <rect x="166" y="44" width="148" height="10" rx="5" fill="#E4E7EA" opacity="0.35"/>
    <rect x="166" y="146" width="148" height="10" rx="5" fill="#14171A" opacity="0.35"/>
  </g>

  <!-- numbered by hand -->
  <text x="240" y="900" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="20" letter-spacing="4"
        fill="#E4E7EA" fill-opacity="0.30">no. 01</text>
</svg>
